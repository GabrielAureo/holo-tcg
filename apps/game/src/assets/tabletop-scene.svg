<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fantasy tabletop scene</title>
  <desc id="desc">A warm wooden fantasy table in perspective with a red cloth, potions, sword, coins, scrolls and candlelight.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a552f"/><stop offset=".45" stop-color="#6c3f25"/><stop offset="1" stop-color="#4a2b1b"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83e32"/><stop offset=".55" stop-color="#8e3029"/><stop offset="1" stop-color="#6e241f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe19a"/><stop offset=".48" stop-color="#c58d35"/><stop offset="1" stop-color="#6a421c"/>
    </linearGradient>
    <radialGradient id="greenPotion" cx="35%" cy="22%" r="80%"><stop offset="0" stop-color="#d6ffd1" stop-opacity=".95"/><stop offset=".25" stop-color="#69d379"/><stop offset="1" stop-color="#1f6e43"/></radialGradient>
    <radialGradient id="purplePotion" cx="30%" cy="20%" r="85%"><stop offset="0" stop-color="#f3d2ff"/><stop offset=".28" stop-color="#b76be0"/><stop offset="1" stop-color="#5b2c8e"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#dfe6e8"/><stop offset=".4" stop-color="#8998a2"/><stop offset=".7" stop-color="#eef4f6"/><stop offset="1" stop-color="#69757d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2a150d" flood-opacity=".48"/></filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="grain" width="120" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 16C24 5 47 28 76 15s32-7 44 0M0 52c28-15 45 10 78-2 18-6 29-4 42 2M10 78c24-7 47 11 92-4" fill="none" stroke="#2c160d" stroke-opacity=".18" stroke-width="5"/>
      <path d="M6 30c30-9 54 5 103-4M2 64c31-7 61 6 108-5" fill="none" stroke="#c48752" stroke-opacity=".11" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e9d7b7"/>
  <path d="M60 70H1540L1490 860H110L60 70Z" fill="url(#wood)" filter="url(#shadow)"/>
  <path d="M60 70H1540L1490 860H110L60 70Z" fill="url(#grain)" opacity=".9"/>
  <g opacity=".2" stroke="#2b160d" stroke-width="8">
    <path d="M410 78L385 850"/><path d="M795 75L800 855"/><path d="M1180 78L1210 850"/>
  </g>

  <path d="M410 120H1190L1275 820H325L410 120Z" fill="#3f1d18" opacity=".28" filter="url(#softShadow)"/>
  <path d="M430 105H1170L1244 792H350L430 105Z" fill="url(#cloth)" stroke="#cc8a50" stroke-width="6"/>
  <path d="M455 132H1145L1211 764H384L455 132Z" fill="none" stroke="#e1b063" stroke-width="3" stroke-dasharray="20 10" opacity=".82"/>
  <path d="M500 172H1100L1150 722H445L500 172Z" fill="none" stroke="#e4b469" stroke-width="2" opacity=".5"/>
  <g fill="none" stroke="#e6bc72" opacity=".34">
