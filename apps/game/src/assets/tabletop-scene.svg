    <path d="M18 88L-42 132" stroke="#8a5a2d" stroke-width="30" stroke-linecap="round"/>
    <path d="M-20 104l40 44" stroke="#cf9e54" stroke-width="10"/>
    <circle cx="-22" cy="124" r="12" fill="#6ea6c8" stroke="#c9a15b" stroke-width="6"/>
  </g>

  <g transform="translate(1280 520) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="185" rx="14" fill="#4f3a27" stroke="#b48242" stroke-width="6"/>
    <path d="M20 18h140v145H20z" fill="#6c4e31" stroke="#d0a75c" stroke-width="3"/>
    <circle cx="90" cy="90" r="42" fill="#29475a" stroke="#d4a24c" stroke-width="8"/>
    <path d="M90 48l12 30 30 12-30 12-12 30-12-30-30-12 30-12Z" fill="#ddb75e"/>
  </g>

  <g transform="translate(95 580) rotate(-11)" filter="url(#shadow)">
