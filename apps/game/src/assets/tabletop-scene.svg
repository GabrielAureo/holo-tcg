  </g>

  <g transform="translate(135 90)" filter="url(#shadow)">
    <ellipse cx="70" cy="105" rx="53" ry="22" fill="#4e2d1c"/>
    <rect x="47" y="15" width="46" height="94" rx="20" fill="#e6b15e"/>
    <path d="M70 15c-17-18-7-38 3-53 18 22 17 39-3 53Z" fill="#ffd36f"/><path d="M72 9c-8-11-3-22 3-31 8 11 8 21-3 31Z" fill="#fff0a8"/>
