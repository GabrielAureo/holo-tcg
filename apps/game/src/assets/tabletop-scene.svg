    <path d="M48 25h50v83H48z" fill="#b8c7c1" fill-opacity=".58" stroke="#d6cfaf" stroke-width="5"/>
    <rect x="42" y="8" width="62" height="27" rx="7" fill="#8a5b36" stroke="#5c3521" stroke-width="4"/>
  </g>

