    <path d="M800 276v264M575 408h450M638 324l324 168M638 492l324-168" stroke-width="2"/>
    <circle cx="800" cy="408" r="42" stroke-width="3"/>
  </g>

  <g transform="translate(100 185) rotate(-7)" filter="url(#shadow)">
