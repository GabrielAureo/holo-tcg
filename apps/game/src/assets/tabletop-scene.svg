  <g fill="#2a160e" opacity=".18">
    <ellipse cx="210" cy="520" rx="130" ry="26"/><ellipse cx="1320" cy="485" rx="180" ry="34"/><ellipse cx="1340" cy="742" rx="140" ry="26"/>
  </g>
</svg>