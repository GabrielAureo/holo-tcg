    <ellipse cx="0" cy="46" rx="20" ry="46" fill="#b79368"/>
    <ellipse cx="235" cy="46" rx="20" ry="46" fill="#b79368"/>
    <path d="M45 20c55 20 91-15 145 18M52 52c38-12 85 8 127-2" fill="none" stroke="#816242" stroke-width="3" opacity=".65"/>
    <path d="M12 44h220" stroke="#8a2f28" stroke-width="14" opacity=".85"/>
